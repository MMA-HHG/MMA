# Signpost manifest of MMA's AI support.
#
# Every file described here is generated by tools/ai_signposts.py; never edit those files by hand.
# After changing this file, AGENTS.md, a skill, a workflow or the core block in .github/CODEOWNERS, run:
#     python3 tools/ai_signposts.py           # write
#     python3 tools/ai_signposts.py --check   # verify, as CI does
# Conventions: docs/ai/README.md, section 10.

conventions_version: "1"

signposts:
  # Tier 1: supported by the project.
  - agent: claude-code
    tier: 1
    kind: import            # CLAUDE.md containing only "@AGENTS.md"
    path: CLAUDE.md
    target: AGENTS.md

  - agent: claude-code
    tier: 1
    kind: pointer-skills    # one pointer skill per skill in .agents/skills, workflow signposts included
    path: .claude/skills

  - agent: claude-code
    tier: 1
    kind: scoped-rule
    format: claude-rule     # paths: front matter
    path: .claude/rules/mma-numerical-core.md

  - agent: claude-code
    tier: 1
    kind: ignore-file       # keeps files that Claude Code writes for one user out of Git
    path: .claude/.gitignore
    patterns: [settings.local.json, worktrees/]

  - agent: all
    tier: 1
    kind: workflow-skills   # one signpost skill mma-<workflow> per workflow in docs/ai/workflows
    path: .agents/skills

  - agent: github-copilot
    tier: 1
    kind: scoped-rule
    format: copilot-instructions   # applyTo: front matter
    path: .github/instructions/mma-numerical-core.instructions.md

  - agent: gemini-cli
    tier: 1
    kind: gemini-settings   # context.fileName; put any further project settings under "extra"
    path: .gemini/settings.json
    context_files: [AGENTS.md, GEMINI.md]

  - agent: cursor
    tier: 1
    kind: scoped-rule
    format: cursor-rule     # globs: front matter
    path: .cursor/rules/mma-numerical-core.mdc

  - agent: codex, gemini-cli
    tier: 1
    kind: nested-agents     # a short AGENTS.md in every core-module directory of .github/CODEOWNERS
    file: AGENTS.md

  # Tier 2: contributed signposts for further agents, marked community and not tested by the
  # project. Template: docs/ai/templates/signpost-entry.yml
