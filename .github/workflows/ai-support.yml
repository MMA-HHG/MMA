name: AI support checks

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Check AI-support structure and signposts
        run: python ai/check_ai_layer.py
      - name: Check optional agent installer behaviour (offline)
        run: python ai/tests/test_ai_agents.py
